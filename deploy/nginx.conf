# Nginx configuration for Laundry App (Astra Pro)
# Serves the React frontend as static files and proxies API/WebSocket traffic
# to the Spring Boot backend on port 8080.
#
# Requirements:
#   - Replace YOUR_DOMAIN with your actual domain (e.g. astra-pro.ma)
#   - Obtain TLS certificates: certbot --nginx -d YOUR_DOMAIN
#   - Place built frontend files in /var/www/laundry/

# ── Rate limiting zones ────────────────────────────────────────────────────
# Auth endpoints: strict limit to slow brute-force attacks
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
# API endpoints: generous limit for normal use
limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=60r/s;

# ── Upstream ───────────────────────────────────────────────────────────────
upstream spring_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS server ───────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN;

    # ── TLS (managed by Certbot) ───────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ───────────────────────────────────────────────────
    # Note: Spring's SecurityHeadersFilter also sets these; Nginx acts as
    # a second layer in case a request bypasses Spring entirely.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # ── Gzip ───────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/json
        application/javascript
        text/html
        text/css
        text/plain
        application/xml
        image/svg+xml;
    gzip_min_length 1024;

    # ── File upload limits (must match Spring's multipart config) ─────────
    client_max_body_size 25M;

    # ── Static frontend ────────────────────────────────────────────────────
    root /var/www/laundry;
    index index.html;

    # Long-term caching for hashed assets (Vite produces content-hashed filenames)
    location ~* \.(js|css|woff2?|ttf|eot|ico|svg|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html: never cache — SPA entry point must always be fresh
    location = /index.html {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # ── Auth endpoints (rate-limited) ──────────────────────────────────────
    location ~ ^/auth/(login|refresh) {
        limit_req zone=auth_limit burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://spring_backend;
        include /etc/nginx/proxy_params;
    }

    # ── Uploaded files served directly by Spring ──────────────────────────
    # Spring adds immutable cache headers; Nginx just proxies.
    location /uploads/ {
        proxy_pass http://spring_backend;
        include /etc/nginx/proxy_params;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── WebSocket (STOMP over SockJS) ─────────────────────────────────────
    location /ws/ {
        proxy_pass http://spring_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── API endpoints ──────────────────────────────────────────────────────
    location ~ ^/(api|admin|employe|livreur|actuator)/ {
        limit_req zone=api_limit burst=200 nodelay;
        proxy_pass http://spring_backend;
        include /etc/nginx/proxy_params;
    }

    # ── SPA fallback — serve index.html for all unmatched routes ──────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Error pages ────────────────────────────────────────────────────────
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /var/www/laundry;
        internal;
    }
}
